<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Book rooms, run club events and register for what is on across campus." />
    <meta name="theme-color" content="#eef2f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b2e28" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b2e28'/%3E%3Cpath d='M7 21h18' stroke='%23f1d265' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M7 13h9' stroke='%23ecefe4' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Campus Board</title>
    <script>
      // Apply the saved theme before first paint, so there is no flash of the wrong colours.
      try { var t = localStorage.getItem('campus.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
