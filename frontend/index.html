<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Book rooms, run club events and register for what is on across campus." />
    <meta name="theme-color" content="#eceeef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f2226" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=Manrope:wght@400;500;600;700;800&display=swap" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231f2226'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%23e3d3b0' stroke-width='2.4'/%3E%3Cpath d='M16 16l4.5-5' stroke='%23e3d3b0' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Campus Board</title>
    <script>
      // Apply the saved theme before first paint, so there is no flash of the wrong colours.
      try { var t = localStorage.getItem('campus.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
