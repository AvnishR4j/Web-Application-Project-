spring:
  application:
    name: campus-booking
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/campus_booking?replicaSet=rs0}
      auto-index-creation: true

app:
  jwt:
    # Must be at least 32 characters. Override with the JWT_SECRET environment variable.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:120}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  booking:
    # Time zone used for opening hours. Set BOOKING_ZONE to your campus zone, e.g. America/New_York.
    zone: ${BOOKING_ZONE:Asia/Kolkata}
  events:
    # Minimum notice for event requests, in days (plan default: 7).
    min-lead-days: ${EVENT_MIN_LEAD_DAYS:7}
  checkin:
    # Signs the rotating check-in codes (32+ characters). Defaults to the JWT secret.
    secret: ${CHECKIN_SECRET:${app.jwt.secret}}
    # Check-in opens this many minutes before an event starts and closes when it ends.
    opens-minutes-before: ${CHECKIN_OPENS_MINUTES_BEFORE:30}
  noshow:
    # Missing this many registered events in the window pauses new registrations (0 turns the rule off).
    limit: ${NOSHOW_LIMIT:3}
    window-days: ${NOSHOW_WINDOW_DAYS:60}
  seed-demo-data: ${SEED_DEMO_DATA:false}
  demo-password: ${DEMO_PASSWORD:Password@123}
  google:
    # "Continue with Google": the OAuth client ID from Google Cloud. Leave empty to turn it off.
    client-id: ${GOOGLE_CLIENT_ID:}
    # Only these email domains may sign in with Google (comma separated).
    allowed-domains: ${GOOGLE_ALLOWED_DOMAINS:thapar.edu}
  signup:
    # false = "Create an account" with a password is refused; people use Google instead.
    password-enabled: ${PASSWORD_SIGNUP_ENABLED:true}
  mail:
    # Email through Brevo (free: 300/day). Leave the key empty to turn email off; features that need it hide themselves.
    brevo-api-key: ${BREVO_API_KEY:}
    # The sender address you verified in Brevo.
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Campus Board}
    reminders-enabled: ${EVENT_REMINDERS:true}
  # Where links in emails point.
  base-url: ${APP_BASE_URL:https://campus-board-sepia-five.vercel.app}
  # One-time clean-up for demos: see DemoDataReset. Switch on, restart, switch off.
  reset-demo-data: ${RESET_DEMO_DATA:false}

server:
  port: 8080
  # Smaller responses, quicker pages: lists of events and rooms compress well.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
