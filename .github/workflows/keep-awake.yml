# Render's free plan puts the backend to sleep after 15 minutes without requests, and the next visitor then
# waits about a minute. This pings the health check every 10 minutes so the site stays quick.
# GitHub pauses scheduled workflows after 60 days with no commits; re-enable it from the Actions tab if so.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: curl -fsS --retry 4 --retry-delay 20 --max-time 90 https://campus-board-api.onrender.com/api/health
