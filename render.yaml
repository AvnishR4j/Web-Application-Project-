# One-click backend on Render: New > Blueprint > pick this repository.
# You will be asked for MONGODB_URI (your Atlas connection string) and DEMO_PASSWORD (the demo accounts'
# password, kept out of the repo). JWT_SECRET is generated for you.
services:
  - type: web
    name: campus-board-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      # Set to "true" for one restart to clear test data and load fresh demo events, then set back to "false".
      - key: RESET_DEMO_DATA
        value: "false"
      # Google sign-in for the college domain. Paste the OAuth Client ID from Google Cloud; empty = button hidden.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_ALLOWED_DOMAINS
        value: thapar.edu
      # Set to "false" once Google sign-in works, so nobody can create a password account.
      - key: PASSWORD_SIGNUP_ENABLED
        value: "true"
      - key: BOOKING_ZONE
        value: Asia/Kolkata
